name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The mod API is early access: pin the build the tests were written against.
  CLAUDE_CODE_VERSION: 2.1.296

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: npm run validate
      - run: npm test
      - run: npm run e2e:unit
      - run: npm run typecheck

  # The end-to-end scenarios tmux runs, in real Claude Code sessions talking
  # to the mock model: no login, no API key, no model call.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      # A first start asks for a theme before anything else.
      - run: echo '{"hasCompletedOnboarding":true,"theme":"dark"}' > ~/.claude.json
      - run: npm run e2e:tmux -- --no-watch
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            e2e/results/
            !e2e/results/latest
          if-no-files-found: ignore
